name: Release XPanel

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Linux release artifacts
        run: |
          set -e
          mkdir -p dist
          build_arch () {
            local arch=$1
            echo "==> 构建 xpanel-linux-$arch"
            mkdir -p "pkg/xpanel/bin"
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w" -o "pkg/xpanel/xpanel" .
            cp xpanel.sh "pkg/xpanel/xpanel.sh"
            # Xray core（官方资源包命名: 64=amd64, arm64-v8a=arm64）
            if [ "$arch" = "arm64" ]; then xray_asset="Xray-linux-arm64-v8a.zip"; else xray_asset="Xray-linux-64.zip"; fi
            echo "==> 下载 $xray_asset"
            curl -fsSL --retry 3 -o xray.zip "https://github.com/XTLS/Xray-core/releases/latest/download/$xray_asset"
            unzip -o -j xray.zip "xray" -d "pkg/xpanel/bin/"
            mv "pkg/xpanel/bin/xray" "pkg/xpanel/bin/xray-linux-$arch"
            # Geo 文件
            curl -fsSL --retry 3 -o "pkg/xpanel/bin/geoip.dat" "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat"
            curl -fsSL --retry 3 -o "pkg/xpanel/bin/geosite.dat" "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat"
            tar -czf "dist/xpanel-linux-$arch.tar.gz" -C pkg xpanel
            rm -rf pkg xray.zip
            # gost 中转 agent
            echo "==> 构建 gost agent ($arch)"
            (cd agent && GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o gost .)
            gzip -c agent/gost > "dist/gost-linux-$arch.gz"
            rm -f agent/gost
          }
          build_arch amd64
          build_arch arm64
          echo "==> 产物清单"
          ls -l dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xpanel-release
          path: dist/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
